<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMU - Game Boy Emulator</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: #0f1012;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #8b9bb4;
        }

        #container {
            text-align: center;
            background: #181a20;
            padding: 32px;
            border: 2px solid #2e3440;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #8bac0f;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Outer frame around the screen for retro bezel aesthetic */
        .screen-bezel {
            background: #000;
            padding: 16px;
            border: 2px solid #2e3440;
            border-radius: 4px;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        /* Upscaled 3x via CSS (160x144 -> 480x432) */
        #screen {
            width: 480px;
            height: 432px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #9bbc0f;
            display: block;
            border: 1px solid #1e232a;
        }

        #controls {
            margin-top: 24px;
            font-size: 11px;
            color: #5e6b7c;
            line-height: 2;
            letter-spacing: 1px;
        }

        #controls kbd {
            background: #252a34;
            border: 1px solid #3b4252;
            border-radius: 3px;
            padding: 3px 6px;
            font-family: inherit;
            font-size: 10px;
            color: #e5e9f0;
            box-shadow: 0 2px 0 #191c24;
        }

        #rom-loader {
            margin-top: 20px;
        }

        #rom-loader label {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            color: #8bac0f;
            border: 2px solid #8bac0f;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        #rom-loader label:hover {
            background: #8bac0f;
            color: #0f1012;
            box-shadow: 0 0 12px rgba(139, 172, 15, 0.3);
        }

        #rom-loader input[type="file"] {
            display: none;
        }

        #status {
            margin-top: 16px;
            font-size: 11px;
            color: #4c566a;
            height: 16px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>EMU</h1>
        <div class="screen-bezel">
            <!-- Native canvas buffer kept at 160x144, scaled to 480x432 via CSS -->
            <canvas id="screen" width="160" height="144"></canvas>
        </div>
        
        <div id="controls">
            <kbd>&larr;</kbd><kbd>&rarr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd> D-PAD &nbsp;&bull;&nbsp;
            <kbd>Z</kbd> A &nbsp;&bull;&nbsp; <kbd>X</kbd> B &nbsp;&bull;&nbsp;
            <kbd>BSPC</kbd> SELECT &nbsp;&bull;&nbsp; <kbd>ENTER</kbd> START
        </div>

        <div id="rom-loader">
            <label for="rom-file">Load ROM (.gb)</label>
            <input type="file" id="rom-file" accept=".gb,.gbc">
        </div>

        <div id="status"></div>
    </div>

    <script>
        var Module = {
            onRuntimeInitialized: function() {
                document.getElementById('status').textContent = 'READY. LOAD A ROM TO START.';
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); }
        };

        var usedKeys = [37, 38, 39, 40, 8, 13, 90, 88];

        document.addEventListener('keydown', function(e) {
            if (usedKeys.indexOf(e.keyCode) !== -1) {
                e.preventDefault();
                if (Module._wasm_set_key) {
                    Module._wasm_set_key(e.keyCode, 1);
                }
            }
        });

        document.addEventListener('keyup', function(e) {
            if (usedKeys.indexOf(e.keyCode) !== -1) {
                e.preventDefault();
                if (Module._wasm_set_key) {
                    Module._wasm_set_key(e.keyCode, 0);
                }
            }
        });

        document.getElementById('rom-file').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').textContent = 'LOADING ' + file.name.toUpperCase() + '...';

            var reader = new FileReader();
            reader.onload = function() {
                var data = new Uint8Array(reader.result);
                Module.FS.writeFile('/rom.gb', data);

                if (Module._wasm_load_rom) {
                    Module._wasm_load_rom();
                    document.getElementById('status').textContent = 'RUNNING: ' + file.name.toUpperCase();
                }
            };
            reader.onerror = function() {
                document.getElementById('status').textContent = 'FAILED TO LOAD ROM.';
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
